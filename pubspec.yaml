name: shivesh_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.2
  intl: ^0.20.2
  pinput: ^6.0.1
  cached_network_image: ^3.4.1
  logger: ^2.6.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4

# Launcher icons for Android + iOS, generated from the Shivesh logo.
#
# Regenerate with:
#   python3 tool/make_icons.py          # rebuild sources from assets/logo/logo.png
#   dart run flutter_launcher_icons     # write platform icon sets
#
# The sources are the lotus MARK only (no wordmark) — see tool/make_icons.py.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/icon_source.png"
  # Android adaptive icon: white plate + inset mark, so the system mask
  # (circle / squircle / teardrop) never clips the artwork.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/icon_foreground.png"
  # iOS rejects any alpha channel in the app icon; flatten it onto white.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/logo/
